schema_version: 1

context:
  name: py2cfg
  version: "1.0.5"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/py2cfg-${{ version }}.tar.gz
  sha256: bcc5b3de6d4a5bce1729dc80b103056bb581c4f0c9096ea67ff6188be2c8c62c

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - py2cfg = py2cfg._runner:main

requirements:
  host:
    - python 3.12.*
    - poetry >=0.12.3
    - poetry-core
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - astor
    - pudb
    - websocket-server
    - python-graphviz
    - flask
    - requests
    - packaging
    - __unix

tests:
  - python:
      imports:
        - py2cfg
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - py2cfg --help

about:
  summary: Converts python source code to colorful Control Flow Graphs (CFGs).
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://gitlab.com/classroomcode/py2cfg

extra:
  recipe-maintainers:
    - jan-janssen
